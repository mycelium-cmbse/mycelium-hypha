# Keeps the repository's dependencies current, as pull requests into development.
#
# - Weekly, with minor and patch updates grouped into one pull request per ecosystem; a major update
#   comes on its own, since it is the one that may need reading the release notes.
# - A cooldown of 14 days: a version is proposed only once it has been out for two weeks, the same
#   rule used when pinning versions by hand.
# - Commit messages and pull-request titles in the repository's "[Update] …" form (the trailing
#   space stops Dependabot adding a colon after the bracket).

version: 2

updates:
  # The four workflows under .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[Update] "
    groups:
      github-actions:
        update-types: [minor, patch]

  # The central package versions in Directory.Packages.props, for every project in the solution,
  # the NativeAOT launcher included.
  - package-ecosystem: nuget
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[Update] "
    groups:
      nuget:
        update-types: [minor, patch]

  # The VS Code extension's development dependencies; nothing from node_modules ships in the VSIX.
  - package-ecosystem: npm
    directory: /extensions/vscode
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[Update] "
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # The Node types follow the Node the extension is built and tested with (node-version in the
      # workflows), not the newest Node: newer types would let code compile that the older Node
      # cannot run. Move this major by hand, together with node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The specification extractor: uv.lock is what the CLI and the VS Code extension install through
  # uv, and what CI installs to lint and test it, so an update here is tested as it ships.
  - package-ecosystem: uv
    directory: /tools/spec-extract
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[Update] "
    groups:
      spec-extract:
        update-types: [minor, patch]
