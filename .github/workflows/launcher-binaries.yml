name: Launcher binaries

# Builds the NativeAOT `hypha-launch` binary (tools/hypha-cli/Hypha.Launcher), the MCP server's launcher,
# for every platform, and commits it into the plugin's bin/: bin/hypha-launch.exe on Windows, which a
# client finds from the extensionless bin/hypha-launch, and bin/<rid>/hypha-launch elsewhere, which the
# POSIX bin/hypha-launch script execs. This file was hook-binaries.yml while it also built the
# SessionStart hook's binary; the hook and its project are gone.
#
# Unlike the full `hypha` CLI (see release.yml), this binary IS committed to the repository: it never
# generates anything itself, only downloads and starts the real CLI, so NativeAOT keeps it small
# (single-digit MB per platform) rather than the ~80MB a self-contained non-AOT publish would need. A
# client starts the server from the plugin's own folder, so the launcher has to be there; see
# tools/hypha-cli/README.md.
#
# True NativeAOT cross-compilation across OS families is not reliably supported, so this needs a
# matrix of native runners, unlike release.yml's single-runner self-contained publish.
#
# Run by hand after any change to Hypha.Launcher. Not tied to a
# version number or a release tag: the committed binaries simply track whatever is on the branch this
# workflow runs against.

on:
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            suffix: .exe
          - os: ubuntu-latest
            rid: linux-x64
            suffix: ''
          # NativeAOT does not cross-compile between architectures without a cross toolchain and a
          # sysroot, so the Arm build runs on an Arm runner.
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            suffix: ''
          - os: macos-latest
            rid: osx-x64
            suffix: ''
          - os: macos-latest
            rid: osx-arm64
            suffix: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install the NativeAOT prerequisites
        # The x64 image has them; the Arm image is not guaranteed to.
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish tools/hypha-cli/Hypha.Launcher/Hypha.Launcher.csproj \
            -c Release -r ${{ matrix.rid }} -p:PublishAot=true \
            -o publish/${{ matrix.rid }}/launch
        shell: bash

      - name: Upload ${{ matrix.rid }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/launch/hypha-launch${{ matrix.suffix }}
          if-no-files-found: error

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download every platform's binary
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: binaries-*
          path: downloaded

      - name: Place binaries under bin/
        run: |
          set -euo pipefail

          # Each artifact holds its one file at its root: an upload of a single file keeps no folder.
          # Windows finds bin/hypha-launch.exe from the extensionless path a manifest names; macOS and
          # Linux run the bin/hypha-launch script, which execs its platform's binary.
          cp downloaded/binaries-win-x64/hypha-launch.exe bin/hypha-launch.exe
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            mkdir -p "bin/${rid}"
            cp "downloaded/binaries-${rid}/hypha-launch" "bin/${rid}/hypha-launch"
            chmod +x "bin/${rid}/hypha-launch"
          done

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add bin

          if git diff --cached --quiet -- bin; then
            echo "::notice::bin is already up to date; nothing to commit."
            exit 0
          fi

          git commit -m "[Add] rebuild the launcher binaries for bin/"
          git push
