name: Build & Test & SonarQube

# A pull request runs this once, through pull_request: it tests the branch merged into its target
# and SonarCloud reports on the pull request. push covers only the long-lived branches, so a commit
# on a pull request does not run everything a second time; any other branch can be run by hand.
on:
  push:
    branches: [development, main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci --ignore-scripts

      - name: Test extension
        working-directory: extensions/vscode
        run: npm test

      - name: Package Linux x64 extension
        working-directory: extensions/vscode
        run: npm run package -- linux-x64

      - name: Smoke-test installed VSIX
        working-directory: extensions/vscode
        run: xvfb-run -a npm run test:host

  vscode-extension-windows:
    name: VS Code Extension (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci --ignore-scripts

      - name: Test extension
        working-directory: extensions/vscode
        run: npm test

      - name: Package Windows x64 extension
        working-directory: extensions/vscode
        run: npm run package -- win32-x64

      # Both Windows archive layouts: current stable keeps cli.js under a commit folder, the
      # oldest supported release (engines.vscode) next to Code.exe.
      - name: Smoke-test installed VSIX on VS Code stable
        working-directory: extensions/vscode
        run: npm run test:host

      - name: Smoke-test installed VSIX on VS Code 1.101.0
        working-directory: extensions/vscode
        env:
          VSCODE_TEST_VERSION: '1.101.0'
        run: npm run test:host

  # The targets the extension builds for but is not yet published for: each runner packages its own
  # platform's VSIX, with a hypha CLI built for it, and smoke-tests it in VS Code on that platform.
  vscode-extension-other-platforms:
    name: VS Code Extension (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci --ignore-scripts

      - name: Check the runner is the target's platform
        working-directory: extensions/vscode
        env:
          TARGET: ${{ matrix.target }}
        run: node -e "const host = process.platform + '-' + process.arch; if (host !== process.env.TARGET) { console.error('The runner is ' + host + ', not ' + process.env.TARGET + '.'); process.exit(1); }"

      - name: Test extension
        working-directory: extensions/vscode
        run: npm test

      - name: Package the extension
        working-directory: extensions/vscode
        run: npm run package -- ${{ matrix.target }}

      - name: Smoke-test installed VSIX on VS Code stable
        working-directory: extensions/vscode
        run: npm run test:host

      - name: Smoke-test installed VSIX on VS Code 1.101.0
        working-directory: extensions/vscode
        env:
          VSCODE_TEST_VERSION: '1.101.0'
        run: npm run test:host

  build:
    name: Build & Test & SonarQube
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          overwrite-settings: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install spec-extract dependencies (Python)
        # A real .venv, not the runner's system interpreter, matching the documented local setup:
        # `move-window`'s pre-flight check looks for tools/spec-extract/.venv/bin/python and fails
        # the step (and every test asserting on it) if it's missing. Installed from uv.lock, the
        # lock `hypha generate` installs from, so this tests the versions users get. uv is the
        # version Hypha.Knowledge pins (UvProvisioner.PinnedVersion); keep the two in step. Wheels
        # only (--no-build), the lock unchanged (--frozen), and spec-extract itself not installed
        # (the tests import it from src). Prepending its bin to PATH lets the later ruff/pytest steps
        # resolve to this venv without changing how they're invoked.
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          python -m pip install --only-binary :all: uv==0.12.10
          cd tools/spec-extract
          uv sync --frozen --extra dev --no-install-project --no-build --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'NuGet.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore mycelium-hypha.slnx

      - name: SonarQube begin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: "-Xmx4096m"
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 12.0.0
          dotnet tool install --global dotnet-coverage --version 18.12.0
          dotnet sonarscanner begin /k:"mycelium-cmbse_mycelium-hypha" /o:"mycelium-cmbse" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.python.coverage.reportPaths="tools/spec-extract/coverage.xml" /d:sonar.python.version="3.12" /d:sonar.test.inclusions="**/spec-extract/tests/**/*" /d:sonar.coverage.exclusions="extensions/vscode/scripts/**"

      - name: Build
        run: dotnet build mycelium-hypha.slnx --no-restore --no-incremental /p:ContinuousIntegrationBuild=true

      - name: Run tests and compute coverage
        # The query API is checked against the jq queries the skills used to run. Locally those tests
        # are skipped without jq; here jq is on the runner, so a missing jq fails instead.
        env:
          HYPHA_REQUIRE_JQ: "1"
        run: dotnet-coverage collect "dotnet test mycelium-hypha.slnx --no-restore --no-build --verbosity normal" -f xml -o "coverage.xml"

      - name: Lint Python (ruff)
        run: ruff check tools/spec-extract

      - name: Test Python and compute coverage
        working-directory: tools/spec-extract
        # Import from the src layout without an editable (source-build) install.
        env:
          PYTHONPATH: src
        run: pytest --cov=spec_extract --cov-report=xml

      - name: Assert the tests wrote nothing
        # Generation is `hypha generate`'s job; the tests verify. One of them regenerates the whole
        # knowledge base into a scratch folder and compares it byte for byte, so a test that writes
        # the repository couples the tests to generation again. After both the .NET and the Python
        # tests, and over the whole working tree: a changed tracked file and a new file .gitignore
        # does not cover both fail.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::the test run changed the working tree; tests must not write the repository"
            exit 1
          fi

      - name: SonarQube end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
