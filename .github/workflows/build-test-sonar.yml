name: Build & Test & SonarQube

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci --ignore-scripts

      - name: Test extension
        working-directory: extensions/vscode
        run: npm test

      - name: Package Linux x64 extension
        working-directory: extensions/vscode
        run: npm run package -- linux-x64

      - name: Smoke-test installed VSIX
        working-directory: extensions/vscode
        run: xvfb-run -a npm run test:host

  vscode-extension-windows:
    name: VS Code Extension (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci --ignore-scripts

      - name: Test extension
        working-directory: extensions/vscode
        run: npm test

      - name: Package Windows x64 extension
        working-directory: extensions/vscode
        run: npm run package -- win32-x64

      # Both Windows archive layouts: current stable keeps cli.js under a commit folder, the
      # oldest supported release (engines.vscode) next to Code.exe.
      - name: Smoke-test installed VSIX on VS Code stable
        working-directory: extensions/vscode
        run: npm run test:host

      - name: Smoke-test installed VSIX on VS Code 1.100.0
        working-directory: extensions/vscode
        env:
          VSCODE_TEST_VERSION: '1.100.0'
        run: npm run test:host

  build:
    name: Build & Test & SonarQube
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
          overwrite-settings: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spec-extract dependencies (Python)
        # A real .venv, not the runner's system interpreter, matching the documented local setup:
        # `move-window`'s pre-flight check looks for tools/spec-extract/.venv/bin/python and fails
        # the step - and every test asserting on it - if it's missing. Wheels only (no source
        # builds / setup scripts) and pinned to the committed lock. Prepending its bin to PATH lets
        # the later ruff/pytest steps resolve to this venv without changing how they're invoked.
        run: |
          python -m venv tools/spec-extract/.venv
          tools/spec-extract/.venv/bin/pip install --only-binary :all: --no-deps -r tools/spec-extract/requirements-dev.lock
          echo "$PWD/tools/spec-extract/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'NuGet.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore mycelium-hypha.sln

      - name: SonarQube begin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: "-Xmx4096m"
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage
          dotnet sonarscanner begin /k:"mycelium-cmbse_mycelium-hypha" /o:"mycelium-cmbse" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.python.coverage.reportPaths="tools/spec-extract/coverage.xml" /d:sonar.python.version="3.12" /d:sonar.test.inclusions="**/spec-extract/tests/**/*" /d:sonar.coverage.exclusions="extensions/vscode/scripts/**"

      - name: Build
        run: dotnet build mycelium-hypha.sln --no-restore --no-incremental /p:ContinuousIntegrationBuild=true

      - name: Run tests and compute coverage
        run: dotnet-coverage collect "dotnet test mycelium-hypha.sln --no-restore --no-build --verbosity normal" -f xml -o "coverage.xml"

      - name: Assert the tests wrote nothing
        # Generation is `hypha generate`'s job; the tests verify. One of them regenerates the whole
        # knowledge base into a scratch folder and compares it byte for byte, so a test that dirties
        # a tracked file has reintroduced the very coupling #81 removed.
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::the test run modified tracked files; tests must not write the repository"
            exit 1
          fi

      - name: Lint Python (ruff)
        run: ruff check tools/spec-extract

      - name: Test Python and compute coverage
        working-directory: tools/spec-extract
        # Import from the src layout without an editable (source-build) install.
        env:
          PYTHONPATH: src
        run: pytest --cov=spec_extract --cov-report=xml

      - name: SonarQube end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
